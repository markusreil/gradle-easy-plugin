group=com.mreil.gradleplugins.easy
version=0.0.107

java.toolchainVersion=17

org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=all
# Larger daemon heap avoids GC churn during Kotlin compile; max only, not committed.
org.gradle.jvmargs=-Xmx2g
kotlin.daemon.jvmargs=-Xmx1g
# Allow parallel Kotlin compilation within a project (scales with workers.max,
# which defaults to CPU count on each machine, so small CI boxes stay safe).
kotlin.parallel.tasks.in.project=true
plugin.settings=com.mreil.easy.settings
plugin.project=com.mreil.easy.project
